[project]
name = "enotify"
version = "0.1.0"
description = "Be notified of new emails via Discord."
readme = "README.md"
requires-python = ">=3.11"

[dependency-groups]

notilib = [
    "aiogoogle>=5.5.0",
    "asyncpg>=0.27.0",
    "aiohttp>=3.10.11",
    "colorlog>=6.7.0",
    "python-dotenv>=1.2.4",
]

bot = [
    { include-group = "notilib" },
    "discord.py==2.2.3",
    "python-dotenv>=1.2.4"
]

website = [
    { include-group = "notilib" },
    "aiogoogle>=5.5.0",
    "aiohttp>=3.10.11",
    "aiohttp-client-cache>=0.8.2",
    "aiosqlite>=0.19.0",  # used by `aiohttp-client-cache`
    "cryptography>=41.0.7",
    "email-validator>=2.1.1",
    "pyjwt>=2.15.0",
    "python-dotenv>=1.2.4",
    "quart>=0.20.0",
    "hypercorn>=0.18.0"
]

health = [
    { include-group = "notilib" },
    "fastapi[standard]>=0.143.3",
    "psycopg[binary]>=3.3.6",
]

tests = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.1"
]

all = [
    { include-group = "notilib" },
    { include-group = "bot" },
    { include-group = "website" },
    { include-group = "health" },
    { include-group = "tests" },
]

